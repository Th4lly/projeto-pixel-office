name: Deploy Pixel Office

on:
  push:
    branches: [main]
    paths:
      - 'crafter-pixel-office/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript
        working-directory: crafter-pixel-office
        run: npm run check

      - name: Generate frontend configuration
        working-directory: crafter-pixel-office
        run: npm run configure

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: crafter-pixel-office/docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
